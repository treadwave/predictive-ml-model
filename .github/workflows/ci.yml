name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend ml

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: pdm
          POSTGRES_DB: pdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://pdm:pdm@localhost:5432/pdm
      TEST_DATABASE_URL: postgresql+psycopg://pdm:pdm@localhost:5432/pdm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^SIMULATOR_WAIT_TIME=.*/SIMULATOR_WAIT_TIME=1/; s/^WORKER_POLL_INTERVAL=.*/WORKER_POLL_INTERVAL=1/' .env

      - name: Start system
        run: docker compose up -d --build

      - name: Check system through frontend
        run: |
          for _ in $(seq 1 90); do
            READY=$(curl -fs http://localhost:5173/api/equipment | jq '[.[] | select(.current_cycle > 0)] | length' || echo 0)
            [ "$READY" -eq 20 ] && break
            sleep 2
          done
          echo "equipment with predictions: $READY"
          [ "$READY" -eq 20 ]
          [ "$(curl -fs http://localhost:5173/api/sensors | jq length)" -eq 21 ]
          curl -fs -X POST -H "Content-Type: application/json" -d '{"equipment_id": 1}' http://localhost:5173/api/predict
          curl -fs http://localhost:5173/ | grep -q 'id="root"'

      - name: Show logs
        if: failure()
        run: docker compose logs

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: pdm
          POSTGRES_DB: pdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://pdm:pdm@localhost:5432/pdm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check models match migrations
        working-directory: backend
        run: alembic check

  model:
    runs-on: ubuntu-latest

    env:
      MODEL_PATH: /tmp/model.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Train model
        working-directory: ml
        run: python baseline_model.py ../data/train_FD001.txt

      - name: Run model check
        working-directory: ml
        run: python baseline_model_check.py ../data/test_FD001.txt --rul ../data/RUL_FD001.txt

  pipeline:
    needs: [migrations, model]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: pdm
          POSTGRES_DB: pdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://pdm:pdm@localhost:5432/pdm
      PSQL_URL: postgresql://pdm:pdm@localhost:5432/pdm
      MODEL_PATH: /tmp/model.json
      SIMULATOR_WAIT_TIME: "0"
      WORKER_POLL_INTERVAL: "5"
      RUL_WARNING: 75
      RUL_CRITICAL: 30
      RUL_CLIP: 125

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r ml/requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Train model
        working-directory: ml
        run: python baseline_model.py ../data/train_FD001.txt

      - name: Run simulator
        working-directory: ml
        run: timeout 300 python simulator.py ../data/train_FD001.txt

      - name: Run worker
        working-directory: ml
        run: timeout 60 python worker.py || [ $? -eq 124 ]

      - name: Check data in DB
        run: |
          EQ=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM equipment")
          SR=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM sensor_readings")
          ML=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM ml_predictions")
          echo "equipment=$EQ sensor_readings=$SR ml_predictions=$ML"
          [ "$EQ" -eq 20 ] && [ "$SR" -gt 0 ] && [ "$ML" -eq "$SR" ]
