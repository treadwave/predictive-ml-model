x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    MODEL_PATH: /models/model.json

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  alert_sender:
    build: ./backend
    <<: *app-env
    command: ["python", "-m", "app.workers.alert_sender"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: ml/Dockerfile
    <<: *app-env
    command: ["python", "simulator.py", "/app/data/train_FD001.txt"]
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: ml/Dockerfile
    <<: *app-env
    command:
      - sh
      - -c
      - "[ -f \"$$MODEL_PATH\" ] || python baseline_model.py /app/data/train_FD001.txt; exec python worker.py"
    volumes:
      - models:/models
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  models:
